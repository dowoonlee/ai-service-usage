name = "aiusage-proxy"
main = "worker.js"
compatibility_date = "2026-08-11"

# 차단 정책은 코드가 아니라 vars에 둔다 — 재배포는 하되 코드 리뷰 없이 값만 바꿔 즉시 반영한다.
[vars]
# 이 버전 미만이 X-App-Version 헤더를 실어 오면 프록시에서 426. 비우면 버전 게이트 off.
# 헤더를 안 보내는 요청은 통과시킨다(fail-open) — worker.js 주석 참조.
MIN_APP_VERSION = ""

# 개별 차단 deviceId, 쉼표 구분. 대소문자 무관.
# 예: BLOCKED_DEVICE_IDS = "60796649-6f33-4ff3-9ebc-4aca814092db,e38d111f-e11c-42a1-8084-cc09d4de9d67"
BLOCKED_DEVICE_IDS = ""
