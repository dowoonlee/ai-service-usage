name: Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app

      - name: Build
        run: swift build

      - name: Run tests
        run: swift test

      # 배틀/강화 엔진은 클라(Swift)↔서버(TS) 비트 파리티가 골든으로 잠겨 있다. deno 골든이 CI에
      # 안 걸리면 파리티 안전망이 로컬 실행에만 의존한다 → 머지 게이트로 강제한다.
      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      # 디렉토리 단위로 돌린다 — 파일을 지정하면 새 테스트를 추가할 때마다 여기를 고쳐야 하고,
      # 고치는 걸 잊으면 조용히 CI 밖에 남는다(정책 테스트가 실제로 그럴 뻔했다).
      # 현재 포함: pvp_engine 파리티 골든 / hmac 서명 파리티 / 서버 정책 경계.
      - name: Server tests (파리티 골든 + 정책 경계)
        run: deno test supabase/functions/_shared/

      # Edge Function 타입 체크. 지금까지 CI에 없어서 타입 오류가 배포 시점에야 드러났다.
      # 함수가 늘어도 자동으로 포함되도록 glob으로 훑는다.
      - name: Edge Function 타입 체크
        run: deno check supabase/functions/*/index.ts

      # pet_meta_gen.ts는 Swift 소스에서 생성한 아티팩트다. 재생성 후 diff가 있으면
      # (uniqueTable 등 수정 후 gen 재실행을 깜빡한 것) 실패시켜 stale 커밋을 막는다.
      - name: pet_meta_gen 신선도
        run: |
          python3 scripts/gen_pet_meta.py
          git diff --exit-code supabase/functions/_shared/pet_meta_gen.ts
